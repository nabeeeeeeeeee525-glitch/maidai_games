<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>My Game Library</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="library-layout">
  <!-- 左側：ゲーム一覧＋検索 -->
  <aside class="sidebar">
    <input type="text" placeholder="ゲーム検索…" class="search-box">
    <ul class="game-list"></ul>
  </aside>

  <!-- 右側：カテゴリ別表示 -->
  <main class="main-content">
    <section class="category-section">
      <h2>新着</h2>
      <div class="game-grid new"></div>
    </section>

    <section class="category-section">
      <h2>最近プレイ</h2>
      <div class="game-grid recent"></div>
    </section>

    <section class="category-section">
      <h2>おすすめ</h2>
      <div class="game-grid recommend"></div>
    </section>

    <section class="category-section">
      <h2>すべてのゲーム</h2>
      <div class="game-grid all"></div>
    </section>
  </main>
</div>

<script>
// JSON読み込み
fetch("games.json")
  .then(res => res.json())
  .then(games => {
    const list = document.querySelector(".game-list");
    const newGrid = document.querySelector(".game-grid.new");
    const recentGrid = document.querySelector(".game-grid.recent");
    const recommendGrid = document.querySelector(".game-grid.recommend");
    const allGrid = document.querySelector(".game-grid.all");

    games.forEach(game => {
      // 左の一覧
      const li = document.createElement("li");
      li.textContent = game.title;
      list.appendChild(li);

      // 🔥 クリックでプルダウンを開く
      li.addEventListener("click", () => {
        const opened = li.querySelector(".dropdown");
        if (opened) {
          opened.remove();
          return;
        }

        const dropdown = document.createElement("div");
        dropdown.className = "dropdown";
        dropdown.innerHTML = `
          <button class="launch-btn">起動する</button>
        `;
        li.appendChild(dropdown);

        // 起動ボタン
        dropdown.querySelector(".launch-btn").addEventListener("click", () => {
          window.open(game.url, "_blank");
        });
      });

      // 🔥 カーソルが li から外れたらプルダウンを閉じる
      li.addEventListener("mouseleave", () => {
        const opened = li.querySelector(".dropdown");
        if (opened) {
          opened.remove();
        }
      });

      // ゲームカード
      const card = document.createElement("div");
      card.className = "game-card";
      card.innerHTML = `
        <a href="${game.url}" target="_blank">
          <img src="${game.image}">
          <p>${game.title}</p>
        </a>
      `;

      // カテゴリ別
      if (game.category === "new") newGrid.appendChild(card.cloneNode(true));
      if (game.category === "recent") recentGrid.appendChild(card.cloneNode(true));
      if (game.category === "recommend") recommendGrid.appendChild(card.cloneNode(true));

      // 全ゲーム
      allGrid.appendChild(card);
    });

    // 🔥 検索機能（大文字小文字無視・先頭一致）
    const searchBox = document.querySelector(".search-box");

    searchBox.addEventListener("input", () => {
      const keyword = searchBox.value.toLowerCase();
      const gameItems = document.querySelectorAll(".game-list li");

      gameItems.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.startsWith(keyword) ? "block" : "none";
      });
    });
  });
</script>

</body>
</html>
