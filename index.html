<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>My Game Library</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: #1b2838;
      color: #c7d5e0;
    }

    .library-layout {
      display: flex;
      height: 100vh;
    }

    /* 左側サイドバー */
    .sidebar {
      width: 240px;
      background-color: #171a21;
      padding: 16px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .search-box {
      width: 100%;
      padding: 8px;
      margin-bottom: 12px;
      background-color: #2a475e;
      border: none;
      color: #c7d5e0;
    }

    .game-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .game-list li {
      padding: 6px 0;
      border-bottom: 1px solid #2a475e;
      cursor: pointer;
    }

    /* 右側メイン表示 */
    .main-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .category-section {
      margin-bottom: 32px;
    }

    .category-section h2 {
      font-size: 20px;
      margin-bottom: 12px;
      border-bottom: 1px solid #2a475e;
      padding-bottom: 4px;
    }

    /* ゲームカード表示 */
    .game-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .game-card {
      width: 160px;
      background-color: #2a475e;
      border-radius: 4px;
      overflow: hidden;
      text-align: center;
      transition: transform 0.2s;
    }

    .game-card:hover {
      transform: scale(1.05);
    }

    .game-card img {
      width: 100%;
      height: 90px;
      object-fit: cover;
    }

    .game-card p {
      margin: 8px 0;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="library-layout">
  <!-- 左側：ゲーム一覧＋検索 -->
  <aside class="sidebar">
    <input type="text" placeholder="ゲーム検索…" class="search-box">
    <ul class="game-list">
      <li>Game A</li>
      <li>Game B</li>
      <li>Game C</li>
      <!-- … -->
    </ul>
  </aside>

  <!-- 右側：カテゴリ別表示 -->
  <main class="main-content">
    <section class="category-section">
      <h2>新着</h2>
      <div class="game-grid">
        <div class="game-card">
          <img src="game1.jpg" alt="Game 1">
          <p>Game Title</p>
        </div>
      </div>
    </section>

    <section class="category-section">
      <h2>最近プレイ</h2>
      <div class="game-grid"></div>
    </section>

    <section class="category-section">
      <h2>おすすめ</h2>
      <div class="game-grid"></div>
    </section>

    <section class="category-section">
      <h2>すべてのゲーム</h2>
      <div class="game-grid"></div>
    </section>
  </main>
</div>

<script>
  const searchBox = document.querySelector(".search-box");
  const gameItems = document.querySelectorAll(".game-list li");

  searchBox.addEventListener("input", () => {
    const keyword = searchBox.value.toLowerCase();

    gameItems.forEach(item => {
      const text = item.textContent.toLowerCase();

      // 大文字小文字無視 ＋ 先頭一致
      if (text.startsWith(keyword)) {
        item.style.display = "block";
      } else {
        item.style.display = "none";
      }
    });
  });
</script>

</body>
</html>
