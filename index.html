<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>My Game Library</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>

<body>

<header class="top-header">
  Maydie Games
</header>

<div class="library-layout">

  <!-- 左側：ゲーム一覧＋検索 -->
  <aside class="sidebar">
    <div class="menu-toggle">≡ メニュー</div>

    <h3 class="fav-title">★ お気に入り</h3>
    <ul class="favorite-list"></ul>

    <!-- スクロール領域 -->
    <div class="sidebar-scroll">
      <input type="text" placeholder="ゲーム検索…" class="search-box">
      <ul class="game-list"></ul>
    </div>

    <!-- プレイ時間ランキング -->
    <div class="ranking-box">
      <h3>プレイ時間ランキング</h3>
      <ul class="ranking-list"></ul>
    </div>
  </aside>

  <!-- 右側：カテゴリ別表示 -->
  <main class="main-content">

    <section class="category-section">
      <h2>新着ゲーム</h2>
      <div class="game-grid new"></div>
    </section>

    <section class="category-section">
      <h2>最近プレイ</h2>
      <div class="game-grid recent"></div>
    </section>

    <section class="category-section">
      <h2>すべてのゲーム</h2>
      <div class="game-grid all"></div>
    </section>

  </main>
</div>

<!-- PC専用ホバー詳細 -->
<div class="hover-detail" id="hoverDetail"></div>

</body>
</html>
