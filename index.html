<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>My Game Library</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: #1b2838;
      color: #c7d5e0;
    }

    .library-layout {
      display: flex;
      height: 100vh;
    }

    /* 左側サイドバー */
    .sidebar {
      width: 240px;
      background-color: #171a21;
      padding: 16px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .search-box {
      width: 100%;
      padding: 8px;
      margin-bottom: 12px;
      background-color: #2a475e;
      border: none;
      color: #c7d5e0;
    }

    .game-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .game-list li {
      padding: 6px 0;
      border-bottom: 1px solid #2a475e;
      cursor: pointer;
    }

    /* 右側メイン表示 */
    .main-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .category-section {
      margin-bottom: 32px;
    }

    .category-section h2 {
      font-size: 20px;
      margin-bottom: 12px;
      border-bottom: 1px solid #2a475e;
      padding-bottom: 4px;
    }

    /* ゲームカード表示 */
    .game-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .game-card {
      width: 160px;
      background-color: #2a475e;
      border-radius: 4px;
      overflow: hidden;
      text-align: center;
      transition: transform 0.2s;
    }

    .game-card:hover {
      transform: scale(1.05);
    }

    .game-card img {
      width: 100%;
      height: 90px;
      object-fit: cover;
    }

    .game-card p {
      margin: 8px 0;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="library-layout">
  <!-- 左側：ゲーム一覧＋検索 -->
  <aside class="sidebar">
    <input type="text" placeholder="ゲーム検索…" class="search-box">
    <ul class="game-list"></ul>
  </aside>

  <!-- 右側：カテゴリ別表示 -->
  <main class="main-content">
    <section class="category-section">
      <h2>新着</h2>
      <div class="game-grid new"></div>
    </section>

    <section class="category-section">
      <h2>最近プレイ</h2>
      <div class="game-grid recent"></div>
    </section>

    <section class="category-section">
      <h2>おすすめ</h2>
      <div class="game-grid recommend"></div>
    </section>

    <section class="category-section">
      <h2>すべてのゲーム</h2>
      <div class="game-grid all"></div>
    </section>
  </main>
</div>

<script>
  // JSON読み込み
  fetch("games.json")
    .then(res => res.json())
    .then(games => {
      const list = document.querySelector(".game-list");
      const newGrid = document.querySelector(".game-grid.new");
      const recentGrid = document.querySelector(".game-grid.recent");
      const recommendGrid = document.querySelector(".game-grid.recommend");
      const allGrid = document.querySelector(".game-grid.all");

      games.forEach(game => {
        // 左の一覧
        const li = document.createElement("li");
        li.textContent = game.title;
        list.appendChild(li);

        // ゲームカード
        const card = document.createElement("div");
        card.className = "game-card";
        card.innerHTML = `
          <a href="${game.url}" target="_blank">
            <img src="${game.image}">
            <p>${game.title}</p>
          </a>
        `;

        // カテゴリ別
        if (game.category === "new") newGrid.appendChild(card.cloneNode(true));
        if (game.category === "recent") recentGrid.appendChild(card.cloneNode(true));
        if (game.category === "recommend") recommendGrid.appendChild(card.cloneNode(true));

        // 全ゲーム
        allGrid.appendChild(card);
      });

      // 検索機能（大文字小文字無視・先頭一致）
      const searchBox = document.querySelector(".search-box");
      const gameItems = document.querySelectorAll(".game-list li");

      searchBox.addEventListener("input", () => {
        const keyword = searchBox.value.toLowerCase();

        gameItems.forEach(item => {
          const text = item.textContent.toLowerCase();
          item.style.display = text.startsWith(keyword) ? "block" : "none";
        });
      });
    });
</script>

</body>
</html>
